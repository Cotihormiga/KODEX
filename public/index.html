<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KODEX - Gym Workout Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background gradient animation -->
    <div class="gradient-bg"></div>
    
    <!-- Header -->
    <header>
        <div class="container">
            <div class="header-content">
                <h1 class="logo">
                    <span class="logo-icon">💪</span>
                    KODEX
                </h1>
                <p class="tagline">Track your gains, achieve your goals</p>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Stats Dashboard -->
        <section class="stats-section">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">🏋️</div>
                    <div class="stat-value" id="totalWorkouts">0</div>
                    <div class="stat-label">Total Workouts</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📊</div>
                    <div class="stat-value" id="totalSets">0</div>
                    <div class="stat-label">Total Sets</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🔥</div>
                    <div class="stat-value" id="totalReps">0</div>
                    <div class="stat-label">Total Reps</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">💯</div>
                    <div class="stat-value" id="totalExercises">0</div>
                    <div class="stat-label">Exercises</div>
                </div>
            </div>
        </section>

        <!-- Add Workout Form -->
        <section class="form-section">
            <div class="card form-card">
                <h2 class="section-title">
                    <span class="title-icon">✨</span>
                    Log New Workout
                </h2>
                <form id="workoutForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="exercise">Exercise</label>
                            <input type="text" id="exercise" placeholder="e.g., Bench Press" required>
                        </div>
                        <div class="form-group">
                            <label for="date">Date</label>
                            <input type="date" id="date" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="sets">Sets</label>
                            <input type="number" id="sets" min="1" placeholder="3" required>
                        </div>
                        <div class="form-group">
                            <label for="reps">Reps</label>
                            <input type="number" id="reps" min="1" placeholder="10" required>
                        </div>
                        <div class="form-group">
                            <label for="weight">Weight (kg)</label>
                            <input type="number" id="weight" step="0.5" placeholder="50">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="notes">Notes (optional)</label>
                        <textarea id="notes" rows="2" placeholder="Add any notes about your workout..."></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        <span class="btn-icon">+</span>
                        Add Workout
                    </button>
                </form>
            </div>
        </section>

        <!-- Workouts List -->
        <section class="workouts-section">
            <div class="section-header">
                <h2 class="section-title">
                    <span class="title-icon">📋</span>
                    Workout History
                </h2>
                <div class="filter-controls">
                    <select id="sortBy" class="filter-select">
                        <option value="date-desc">Newest First</option>
                        <option value="date-asc">Oldest First</option>
                        <option value="exercise">By Exercise</option>
                    </select>
                </div>
            </div>
            
            <div id="workoutsList" class="workouts-grid">
                <div class="empty-state">
                    <div class="empty-icon">🏃‍♂️</div>
                    <h3>No workouts yet!</h3>
                    <p>Start logging your workouts to track your progress</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2026 KODEX. Built with 💪 and dedication.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
